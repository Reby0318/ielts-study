<!doctype html>
<meta charset="utf-8">
<title>IELTS Vocabulary</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>

/* Layout: the simulator's exam chrome on top, a single reading column of lecture notes below,
   results and transcript appended under the notes after submitting. Tokens match the simulator. */
:root{
  --ground:#F6F7F9; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#E4EAF0;
  --ink:#16202B; --ink-2:#4E5D6C; --ink-3:#7B8896;
  --rule:#D7DEE6; --rule-strong:#B4C0CC;
  --accent:#1C4E6B; --accent-2:#2E7BA6; --accent-soft:#E2EDF4;
  --bad:#8E3B2B; --bad-soft:#F7E9E5;
  --gold:#8A6414; --gold-soft:#F7EFDB;
  --good:#2C6349; --good-soft:#E2F0E9;
  --chrome:#1B2733; --chrome-2:#243442; --chrome-ink:#E8EEF4; --chrome-ink-2:#9FB0C0;
  --mark:#FFF1B8;
  --shadow:0 1px 2px rgba(22,32,43,.06), 0 8px 24px -16px rgba(22,32,43,.24);
  --sans:"IBM Plex Sans",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --serif:"Newsreader",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1016; --surface:#141C24; --surface-2:#1A242D; --surface-3:#222D37;
  --ink:#E4ECF3; --ink-2:#A6B4C0; --ink-3:#7C8B98;
  --rule:#2A3742; --rule-strong:#3B4B58;
  --accent:#82BEDD; --accent-2:#A3D2E9; --accent-soft:#16303F;
  --bad:#E5A395; --bad-soft:#33201C;
  --gold:#D9B667; --gold-soft:#2E2612;
  --good:#84C6A2; --good-soft:#15291F;
  --chrome:#0E161E; --chrome-2:#18242F; --chrome-ink:#E8EEF4; --chrome-ink-2:#8D9EAE;
  --mark:#4A3F12;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0B1016; --surface:#141C24; --surface-2:#1A242D; --surface-3:#222D37;
  --ink:#E4ECF3; --ink-2:#A6B4C0; --ink-3:#7C8B98;
  --rule:#2A3742; --rule-strong:#3B4B58;
  --accent:#82BEDD; --accent-2:#A3D2E9; --accent-soft:#16303F;
  --bad:#E5A395; --bad-soft:#33201C;
  --gold:#D9B667; --gold-soft:#2E2612;
  --good:#84C6A2; --good-soft:#15291F;
  --chrome:#0E161E; --chrome-2:#18242F; --chrome-ink:#E8EEF4; --chrome-ink-2:#8D9EAE;
  --mark:#4A3F12;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.tab{font-variant-numeric:tabular-nums}

/* chrome */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid #000}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:50px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand .tag{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chrome-ink-2);background:var(--chrome-2);padding:3px 8px;border-radius:3px;white-space:nowrap}
.brand b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbtn{background:var(--chrome-2);color:var(--chrome-ink);border:1px solid #0006;border-radius:4px;padding:6px 12px;font-size:13px}
.cbtn:hover{background:#2E4051}
.cbtn[aria-pressed="true"]{background:var(--accent-2);color:#fff;border-color:transparent}
.clock{font-family:var(--mono);font-weight:600;font-size:13.5px;background:var(--chrome-2);padding:5px 11px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* home */
.hero{padding-block:28px 6px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.1;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--ink-2);max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin-block:22px 10px}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.stat .s{font-size:12.5px;color:var(--ink-2)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:18px 12px}
.chip{border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:5px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bar .sp{flex:1}
.pbtn{background:var(--accent);color:#fff;border:0;border-radius:5px;padding:8px 15px;font-weight:600;font-size:14px}
:root[data-theme="dark"] .pbtn{color:#0B1016}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pbtn{color:#0B1016}}
.pbtn:hover{filter:brightness(1.08)}
.gbtn{background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:5px;padding:7px 14px;font-size:14px}
.gbtn:hover{background:var(--surface-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:28px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 13px;color:var(--ink)}
.card:hover{border-color:var(--accent-2)}
.card .no{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px;grid-row:span 2}
.card .t{font-weight:600;font-size:14.5px;line-height:1.3}
.card .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.pill{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--gold-soft);color:var(--gold)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.errbars{display:grid;gap:7px}
.eb{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.eb .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.eb .fill{height:100%;background:var(--bad);border-radius:4px}
.eb .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border-radius:3px;padding:2px 7px}
.words span small{color:var(--ink-3);margin-left:5px}
.muted{color:var(--ink-3);font-size:13px}
.foot{padding-block:8px 36px;font-size:13px;color:var(--ink-3)}
.foot a{color:var(--accent)}

/* session */
.instr{background:var(--surface-2);border-bottom:1px solid var(--rule)}
.instr .wrap{padding-block:10px;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.instr .rng{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.instr p{margin:0;font-size:13.5px;color:var(--ink-2)}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-top:16px}
.phase{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.phase.live{background:var(--bad-soft);color:var(--bad)}
.phase.prev{background:var(--gold-soft);color:var(--gold)}
.prog{flex:1 1 160px;height:6px;background:var(--surface-2);border-radius:3px;position:relative;min-width:120px}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--accent-2);border-radius:3px}
.prog.seek{cursor:pointer}
.ptime{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
select.sel{font:inherit;font-size:13px;padding:5px 6px;border-radius:4px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink)}
.sheet{background:var(--surface);border:1px solid var(--rule-strong);border-radius:6px;padding:22px 26px 26px;margin-block:14px 18px;box-shadow:var(--shadow)}
@media (max-width:600px){.sheet{padding:16px 14px 20px}}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:1.45rem;margin:0 0 6px;text-align:center}
.sheet h4{font-size:14.5px;font-weight:600;margin:18px 0 6px;color:var(--ink)}
.sheet ul{margin:0;padding-left:20px;display:grid;gap:9px}
.sheet li{line-height:2.1;font-size:1.06rem}
.sheet h3{font-size:1.7rem!important}.sheet h4{font-size:1.05rem!important}
.gapq input{font-size:16.5px!important;width:11em!important}
.tx p{font-size:1.02rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))!important}
.gapq{display:inline-flex;align-items:center;gap:0;vertical-align:baseline;white-space:nowrap}
.gapq .qn{font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--ink);color:var(--surface);border-radius:3px 0 0 3px;padding:2px 6px;line-height:1.5}
.gapq input{font:inherit;font-size:15px;width:9.5em;max-width:46vw;padding:1px 7px;border:1px solid var(--rule-strong);border-left:0;border-radius:0 3px 3px 0;background:var(--surface);color:var(--ink);line-height:1.5}
.gapq input:focus{outline:2px solid var(--accent-2);outline-offset:0;border-color:var(--accent-2)}
.gapq input.ok{background:var(--good-soft);border-color:var(--good)}
.gapq input.no{background:var(--bad-soft);border-color:var(--bad)}
.gapq input[readonly]{cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.score .big{font-family:var(--serif);font-size:3rem;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.score .of{color:var(--ink-3);font-size:1.2rem}
table.res{width:100%;border-collapse:collapse;font-size:14px}
.tscroll{overflow-x:auto}
table.res th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--rule)}
table.res td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
table.res tr.jump{cursor:pointer}
table.res tr.jump:hover td{background:var(--surface-2)}
.v-ok{color:var(--good);font-weight:600}
.v-no{color:var(--bad);font-weight:600}
.why{font-size:12.5px;color:var(--ink-2)}
.tx p{margin:0 0 12px;max-width:72ch;cursor:pointer;border-radius:4px;padding:2px 6px;margin-left:-6px}
.tx p:hover{background:var(--surface-2)}
.tx p.now{background:var(--accent-soft)}
.tx mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.tx mark b{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--accent);margin-right:3px;vertical-align:1px}
.tx mark.miss{box-shadow:inset 0 -2px 0 var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:5px;font-size:13.5px;z-index:20}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);border:1px solid var(--rule);color:var(--ink);padding:10px 12px;border-radius:5px;font-size:14px}

/* attempts history */
.hist{list-style:none;margin:0;padding:0;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--surface)}
.hday{padding:7px 16px;background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-top:1px solid var(--rule)}
.hday:first-child{border-top:0}
.hrow{display:grid;grid-template-columns:44px minmax(0,1fr) 70px 54px auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--rule)}
.hrow:hover{background:var(--surface-2)}
.hno{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.ht{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;min-width:0}.ht b{font-weight:600}.ht small{color:var(--ink-3);font-family:var(--mono);font-size:.74rem}
.hsc{font-family:var(--mono);font-size:.9rem;text-align:right}
.hband{font-family:var(--mono);font-weight:700;text-align:center;border-radius:6px;padding:4px 0;color:var(--ink-3);background:var(--surface-2)}
.hband.b8{background:var(--good-soft);color:var(--good)}.hband.b7{background:var(--accent-soft);color:var(--accent)}.hband.b6{background:var(--gold-soft);color:var(--gold)}.hband.b5{background:var(--bad-soft);color:var(--bad)}
.hact{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.hgo{font:inherit;font-size:.82rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:5px 12px;cursor:pointer}
.hgo:hover{background:var(--accent);color:var(--surface)}
.hgo.hyes{border-color:var(--bad);color:var(--bad)}.hgo.hyes:hover{background:var(--bad);color:var(--surface)}
.hconf{font-size:.82rem;color:var(--ink-2)}
.hdel{display:grid;place-items:center;border:1px solid transparent;background:none;color:var(--ink-3);border-radius:5px;padding:5px;cursor:pointer}
.hdel:hover{color:var(--bad);border-color:var(--bad)}
@media (max-width:680px){.hrow{grid-template-columns:40px minmax(0,1fr) 54px}.hsc{display:none}.hact{grid-column:1/-1;justify-content:flex-start}}
/* trends + corrections */
.trends{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.trend{margin:0}.trend svg{width:100%;height:auto;display:block}
.trend figcaption{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.trend figcaption span{text-transform:none;letter-spacing:0}
.bandchip{display:inline-flex;align-items:baseline;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:5px;padding:4px 10px;font-weight:600}
.bandchip small{font-weight:400;color:var(--ink-2)}
.fix{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.45}
.fix q{quotes:none;font-style:italic;color:var(--ink)}
.fix q mark{background:var(--mark);color:inherit;font-style:normal;font-weight:600;padding:0 2px;border-radius:2px}
.fix .tip{display:block;margin-top:3px;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Vocabulary: set list on the home screen, one card at a time when learning. */
.groups{display:grid;gap:22px;margin:8px 0 26px}
.group h2{font-family:var(--serif);font-weight:500;font-size:1.45rem;margin:0 0 4px}
.group .gsub{color:var(--ink-2);margin:0 0 12px;font-size:.95rem;max-width:80ch}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.set{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:13px 14px;display:grid;gap:8px}
.set .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.set .sh b{font-size:1.02rem}
.set .sh span{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.set .lvl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mbar{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--good);border-radius:4px}
.set .btns{display:flex;gap:6px;flex-wrap:wrap}
.set .btns button{font:inherit;font-size:.86rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:5px;padding:5px 11px;cursor:pointer}
.set .btns button:first-child{background:var(--accent);color:var(--surface)}
.set .btns button:hover{filter:brightness(1.08)}
.flash{max-width:760px;margin:22px auto;background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:34px 30px;box-shadow:var(--shadow);text-align:center}
.flash .w{font-family:var(--serif);font-size:clamp(2rem,5vw,3rem);font-weight:500;margin:0}
.flash .pos{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin:6px 0 0}
.flash .def{font-size:1.25rem;margin:22px 0 0;color:var(--ink)}
.flash .ex{margin:16px auto 0;max-width:60ch;text-align:left;font-family:var(--serif);font-size:1.06rem;color:var(--ink-2)}
.flash .ex li{margin:0 0 6px}
.flash .ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.flash .ctl button{font:inherit;font-size:1rem;border-radius:6px;padding:10px 20px;cursor:pointer;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.flash .ctl button.p{background:var(--accent);color:var(--surface)}
.flash .ctl button.g{border-color:var(--good);color:var(--good)}
.flash .ctl button.b{border-color:var(--bad);color:var(--bad)}
.prog2{max-width:760px;margin:16px auto 0;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.prog2 .mbar{flex:1}
.q{max-width:820px;margin:20px auto;background:var(--surface);border:1px solid var(--rule-strong);border-radius:10px;padding:26px 28px;box-shadow:var(--shadow)}
.q .qh{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.q .prompt{font-size:1.3rem;margin:0 0 18px}
.q .prompt b{font-family:var(--serif);font-size:1.6rem;font-weight:500}
.opts{display:grid;gap:8px}
.opts button{font:inherit;font-size:1.04rem;text-align:left;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:11px 14px;cursor:pointer}
.opts button:hover{border-color:var(--accent-2)}
.opts button.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.opts button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.spell input{font:inherit;font-size:1.3rem;width:100%;padding:10px 14px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-family:var(--serif)}
.spell input.ok{border-color:var(--good);background:var(--good-soft)}.spell input.no{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin:14px 0 0;font-size:1rem}
.fb .right{color:var(--good);font-weight:600}.fb .wrong{color:var(--bad);font-weight:600}
.reslist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.reslist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;border-bottom:1px solid var(--rule);padding:7px 0}
.reslist .y{color:var(--good);font-weight:700}.reslist .n{color:var(--bad);font-weight:700}
.reslist small{display:block;color:var(--ink-2)}
.srcs{font-size:.88rem;color:var(--ink-2);max-width:90ch}
.srcs li{margin:0 0 4px}

function histHtml(rows,empty){
  if(!rows.length)return '<p class="muted" style="margin:0">'+empty+'</p>';
  rows=rows.slice().sort(function(x,y){return x.at<y.at?1:-1});
  var day="",h='<ul class="hist">';
  rows.forEach(function(r){var d=new Date(r.at),ds=d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    if(ds!==day){day=ds;h+='<li class="hday">'+esc(ds)+'</li>'}
    var b=r.band,bc=b==null?"":b>=8?"b8":b>=7?"b7":b>=6?"b6":"b5";
    h+='<li class="hrow" data-id="'+esc(r.id)+'"><span class="hno">#'+("0"+r.n).slice(-2)+'</span>'+
      '<span class="ht"><b>'+esc(r.title)+'</b><small>'+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})+(r.extra?' · '+esc(r.extra):'')+'</small></span>'+
      '<span class="hsc">'+esc(r.score)+'</span><span class="hband '+bc+'">'+(b==null?"–":(+b).toFixed(1))+'</span>'+
      '<span class="hact"><button type="button" class="hgo" data-act="review">Review</button><button type="button" class="hdel" data-act="del" title="Delete this attempt" aria-label="Delete this attempt">'+DEL_ICON+'</button></span></li>'});
  return h+'</ul>';
}
function bindHist(root,onReview,onDelete){
  if(!root)return;
  root.addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b)return;var row=b.closest(".hrow"),id=row.dataset.id;
    if(b.dataset.act==="review")onReview(id);
    else if(b.dataset.act==="del"){row.querySelector(".hact").innerHTML='<span class="hconf">Delete for good?</span><button type="button" class="hgo hyes" data-act="yes">Delete</button><button type="button" class="hgo" data-act="no">Keep</button>'}
    else if(b.dataset.act==="yes")onDelete(id);
    else if(b.dataset.act==="no")onDelete(null)});
}

function bandTxt(b){return b==null?"–":(+b).toFixed(1)}
function trendCharts(pts,opt){
  opt=opt||{};
  if(pts.length<2)return '<p class="muted" style="margin:0">Your band and score trend appears here after two attempts.</p>';
  pts=pts.slice(-30);
  function chart(kind){
    var W=460,H=212,L=34,R=10,T=26,B=26,n=pts.length,X=function(i){return L+(W-L-R)*(n===1?.5:i/(n-1))};
    var lo,hi,ticks,Y,val,col,lab;
    if(kind==="band"){lo=opt.bandLo||4;hi=9;ticks=[];for(var b=lo;b<=hi;b++)ticks.push(b);val=function(p){return p.band};col="var(--accent)";lab="Band"}
    else{lo=0;hi=100;ticks=[0,25,50,75,100];val=function(p){return p.max?100*p.score/p.max:null};col="var(--gold)";lab="Score %"}
    Y=function(v){return T+(H-T-B)*(1-(Math.max(lo,Math.min(hi,v))-lo)/(hi-lo))};
    var g="";ticks.forEach(function(t){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--rule)"/><text x="'+(L-7)+'" y="'+(Y(t)+4)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10.5" fill="var(--ink-3)">'+t+'</text>'});
    var ps=[];pts.forEach(function(p,i){var v=val(p);if(v!=null&&!isNaN(v))ps.push([X(i),Y(v),p,v])});
    if(ps.length>1)g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.2" stroke-linejoin="round" points="'+ps.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")+'"/>';
    ps.forEach(function(p,k){var last=k===ps.length-1;g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?5:4)+'" fill="'+col+'"'+(last?' stroke="var(--surface)" stroke-width="2"':'')+'><title>'+esc(p[2].label)+': '+(kind==="band"?"band "+bandTxt(p[3]):p[2].score+"/"+p[2].max)+'</title></circle>'});
    var lastp=ps[ps.length-1];
    if(lastp)g+='<text x="'+Math.min(W-R-2,lastp[0]+8).toFixed(1)+'" y="'+(lastp[1]-8).toFixed(1)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="600" fill="var(--ink)">'+(kind==="band"?bandTxt(lastp[3]):lastp[2].score+"/"+lastp[2].max)+'</text>';
    g+='<text x="'+L+'" y="'+(H-6)+'" font-family="IBM Plex Mono,monospace" font-size="10" fill="var(--ink-3)">oldest</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="10" fill="var(--ink-3)">latest</text>';
    return '<figure class="trend"><figcaption>'+lab+(kind==="band"?(opt.bandNote?' <span>'+opt.bandNote+'</span>':''):' <span>correct answers</span>')+'</figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+lab+' for each attempt, oldest to newest">'+g+'</svg></figure>';
  }
  return '<div class="trends">'+(opt.noBand?'':chart("band"))+(opt.noScore?'':chart("score"))+'</div>';
}

function saveSaved(){lsSet("vc.saved",SAVED);if(DBV)DBV.set({saved:SAVED,at:new Date().toISOString()}).catch(function(){})}
function toggleSaved(k){SAVED[k]=isSaved(k)?-Date.now():Date.now();saveSaved()}
function savedSet(){var ws=Object.keys(SAVED).filter(function(k){return SAVED[k]>0&&WBYK[k]}).sort(function(a,b){return SAVED[b]-SAVED[a]})
  .map(function(k){var w=WBYK[k];return [w[0],w[1],w[2],k]});
  return {id:"saved",name:"My saved words",words:ws}}
function setById(id){return id==="saved"?savedSet():SETS.filter(function(x){return x.id===id})[0]}
function starBtn(k,big){return '<button type="button" class="svb'+(isSaved(k)?' on':'')+(big?' big':'')+'" data-sv="'+esc(k)+'">'+(isSaved(k)?'★ Saved':'☆ Save')+'</button>'}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-sv]");if(!b)return;
  toggleSaved(b.dataset.sv);var on=isSaved(b.dataset.sv);
  $$('[data-sv]').forEach(function(x){if(x.dataset.sv===b.dataset.sv){x.classList.toggle("on",on);x.textContent=on?"★ Saved":"☆ Save"}});
  var c=$("#svN");if(c)c.textContent=savedSet().words.length;toast(on?"Saved for recap":"Removed from saved words")});
function mastered(s){return s.words.filter(function(w){return KNOWN[wk(s,w)]===2}).length}
(function connect(){var tries=0;(function wait(){
  if(!(CL()&&CL().use)){if(++tries<40)setTimeout(wait,250);return}
  Promise.all([CL().use("db"),CL().use("user")]).then(function(r){var db=r[0],user=r[1];if(!db||!user)return;
    return user.id().then(function(id){if(!id)return;var col=db.collection("data/users/"+id+"/drills/vocab"),st=db.doc("data/users/"+id+"/drills/vstate/known"),sv=db.doc("data/users/"+id+"/drills/vstate/saved");
      return Promise.all([col.get(),st.get().catch(function(){return null}),sv.get().catch(function(){return null})]).then(function(r2){
        var rs=r2[2]&&r2[2].exists&&r2[2].data();if(rs&&rs.saved){for(var x in rs.saved)if(!(x in SAVED)||Math.abs(rs.saved[x])>Math.abs(SAVED[x]))SAVED[x]=rs.saved[x]}
        DBV=sv;saveSaved();var sn=r2[0],have={},gone=delIds("vc");
        sn.docs.forEach(function(d){var v=d.data();if(v&&v.id&&gone.indexOf(v.id)>=0){col.doc(d.id).delete().catch(function(){});return}
          if(v&&v.id){have[v.id]=1;if(!HIST.some(function(x){return x.id===v.id}))HIST.push(v)}});
        var k=r2[1]&&r2[1].exists&&r2[1].data();if(k&&k.known){for(var w in k.known)if(!(w in KNOWN)||k.known[w]>KNOWN[w])KNOWN[w]=k.known[w];lsSet("vc.known",KNOWN)}
        DBC=col;DBS=st;saveLocal();saveKnown();
        return HIST.filter(function(a){return !have[a.id]}).reduce(function(p,a){return p.then(function(){return col.doc(a.id).set(a).catch(function(){})})},Promise.resolve());
      }).then(function(){if(VIEW==="home")home()});});
  }).catch(function(){});})();})();


/* ---------- organised home: jump menu, folding sections, search ---------- */
function gProg(g){var m=0,n=0;g.sets.forEach(function(s){m+=mastered(s);n+=s.words.length});return [m,n]}
function vOpenAll(){return lsGet("vc.open",null)}
function vOpen(name){var o=vOpenAll();return o?o.indexOf(name)>=0:name===GROUPS[0].name}
function vNav(){
  return '<nav class="vnav" aria-label="Sections"><div class="vchips">'+GROUPS.map(function(g,gi){var gp=gProg(g);
    return '<button type="button" class="vchip" data-jump="'+gi+'"><b>'+esc(g.name)+'</b><span>'+gp[0]+'/'+gp[1]+'</span></button>'}).join("")+'</div>'+
    '<label class="vsearch"><span>Find a word</span><input type="search" id="vq" placeholder="e.g. mitigate, over the moon" autocomplete="off"></label>'+
    '<p class="vhit" id="vhit" hidden></p></nav>';
}
function vBind(){
  var save=function(){lsSet("vc.open",$$("details[data-g]").filter(function(d){return d.open}).map(function(d){return d.dataset.g}))};
  $$("details[data-g]").forEach(function(d){d.addEventListener("toggle",function(){if(!$("#vq").value)save()})});
  $$("[data-jump]").forEach(function(b){b.onclick=function(){var sec=$("#vg"+b.dataset.jump),d=sec&&sec.querySelector("details");
    if(d&&!d.open){d.open=true;save()}if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"})}});
  var q=$("#vq"),hit=$("#vhit");
  q.oninput=function(){var t=q.value.trim().toLowerCase(),sets=0;
    $$("section.group").forEach(function(sec){var d=sec.querySelector("details"),n=0;
      sec.querySelectorAll(".set").forEach(function(el){var ok=!t||el.dataset.q.indexOf(t)>=0;el.hidden=!ok;if(ok)n++});
      sec.hidden=!!t&&!n;if(t&&n)d.open=true;sets+=t?n:0});
    if(!t){var o=vOpenAll();$$("details[data-g]").forEach(function(d){d.open=o?o.indexOf(d.dataset.g)>=0:d.dataset.g===GROUPS[0].name})}
    hit.hidden=!t;hit.textContent=t?(sets?sets+(sets===1?" set contains “":" sets contain “")+q.value.trim()+"”":"No set contains “"+q.value.trim()+"”"):"";};
}
function savedCard(){var s=savedSet(),n=s.words.length;
  return '<section class="svcard"><div class="sh"><b>⭐ My saved words</b><span><span id="svN">'+n+'</span> saved</span></div>'+
    (n?'<p class="muted">Every word you marked ☆ Save, newest first. Recap them here.</p><div class="btns"><button data-svgo="learn">Flashcards</button><button data-svgo="quiz">Meaning quiz</button><button data-svgo="spell">Spelling</button><button data-svgo="list">See the list</button></div>'
      :'<p class="muted">Press ☆ Save on a flashcard, a quiz answer or a result, and the word collects here for your recap.</p>')+'</section>'}
function savedList(){
  VIEW="saved";document.onkeydown=null;var s=savedSet();
  $("#app").innerHTML=shell(s,"Recap",'<section class="panel" style="margin-top:18px">'+(s.words.length?'<ul class="reslist">'+s.words.map(function(w){var src=SETS.filter(function(x){return x.id===w[3].split("|")[0]})[0];
    return '<li><span class="y">'+(KNOWN[w[3]]===2?"✓":"·")+'</span><span><b>'+esc(w[0])+'</b> <span class="muted">'+esc(w[1])+(src?' · '+esc(src.name):'')+'</span><small>'+esc(w[2])+'</small></span>'+starBtn(w[3])+'</li>'}).join("")+'</ul>'
    :'<p class="muted">No saved words yet.</p>')+'</section><div class="actions"><button class="gbtn" id="hm">All sets</button></div>');
  wire();$("#hm").onclick=home;window.scrollTo(0,0);
}
/* ---------- home ---------- */
var VIEW="home";
function home(){
  VIEW="home";
  var known=Object.keys(KNOWN).filter(function(k){return KNOWN[k]===2}).length;
  var qs=HIST.slice().sort(function(x,y){return x.at<y.at?-1:1});
  var last5=qs.slice(-5),avg=last5.length?Math.round(100*last5.reduce(function(t,a){return t+a.score/a.max},0)/last5.length):null;
  var weakest=SETS.filter(function(s){return qs.some(function(a){return a.set===s.id})}).map(function(s){var h=qs.filter(function(a){return a.set===s.id});
    return [s,h.reduce(function(t,a){return t+a.score/a.max},0)/h.length]}).sort(function(a,b){return a[1]-b[1]})[0];
  var tp=qs.map(function(a){var s=SETS.filter(function(x){return x.id===a.set})[0];return {band:null,score:a.score,max:a.max,label:(s?s.name:"")+" "+a.mode}});
  var h='<header class="top"><div class="wrap"><div class="brand"><button class="cbtn" id="toSim">← Menu</button><span class="tag">Vocabulary</span><b>IELTS Vocabulary</b></div>'+
    '<span class="clock tab">'+known+' / '+TOTAL+' mastered</span></div></header>'+
    '<main class="wrap"><section class="hero"><h1>Build the vocabulary the test rewards</h1>'+
    '<p>'+TOTAL+' words and phrases in '+SETS.length+' sets, grouped by what you need them for. Open a section, then learn a set with flashcards, test yourself with a meaning quiz, and practise spelling.</p></section>'+
    '<div class="stats"><div class="stat"><div class="k">Words mastered</div><div class="v">'+known+'<span class="muted"> / '+TOTAL+'</span></div><div class="s">marked “knew it” in flashcards or right in a quiz</div></div>'+
    '<div class="stat"><div class="k">Quizzes taken</div><div class="v">'+qs.length+'</div><div class="s">meaning and spelling</div></div>'+
    '<div class="stat"><div class="k">Last 5 average</div><div class="v">'+(avg==null?"–":avg+"%")+'</div><div class="s">'+(avg==null?"after your first quiz":"of answers correct")+'</div></div>'+
    '<div class="stat"><div class="k">Needs work</div><div class="v" style="font-size:1.05rem;padding-block:5px">'+(weakest?esc(weakest[0].name):"–")+'</div><div class="s">'+(weakest?Math.round(weakest[1]*100)+"% average":"your weakest set appears here")+'</div></div></div>'+
    /*VOCAB_ORGANISED*/vNav()+savedCard()+'<div class="groups">'+GROUPS.map(function(g,gi){var gp=gProg(g);return '<section class="group" id="vg'+gi+'"><details data-g="'+esc(g.name)+'"'+(vOpen(g.name)?' open':'')+'><summary><h2>'+esc(g.name)+'</h2>'+'<span class="gprog">'+g.sets.length+' sets · '+gp[0]+' / '+gp[1]+' mastered</span><span class="gbar"><i style="width:'+(gp[1]?100*gp[0]/gp[1]:0)+'%"></i></span></summary><p class="gsub">'+esc(g.sub)+'</p><div class="sets">'+
      g.sets.map(function(s){var m=mastered(s),n=s.words.length;
        return '<div class="set" data-q="'+esc((s.name+' '+s.words.map(function(w){return w[0]+' '+w[2]}).join(' ')).toLowerCase())+'"><div class="sh"><b>'+esc(s.name)+'</b><span>'+m+'/'+n+'</span></div>'+(s.level?'<span class="lvl">'+esc(s.level)+'</span>':'')+
          '<div class="mbar" title="'+m+' of '+n+' mastered"><i style="width:'+(100*m/n)+'%"></i></div>'+
          '<div class="btns"><button data-go="learn" data-s="'+s.id+'">Flashcards</button><button data-go="quiz" data-s="'+s.id+'">Meaning quiz</button><button data-go="spell" data-s="'+s.id+'">Spelling</button></div></div>'}).join("")+'</div></details></section>'}).join("")+'</div>'+
    '<details class="vhist"><summary>Your scores and quiz history</summary>'+
    '<div class="cols" style="margin-top:16px"><section class="panel"><h2>Score trend</h2>'+trendCharts(tp,{noBand:true})+'</section>'+
    '<section class="panel" id="histp"><h2>Your quizzes</h2>'+histHtml(HIST.map(function(a){var s=setById(a.set);
      return {id:a.id,at:a.at,n:a.num||0,title:(s?s.name:"Set")+(a.mode==="spell"?" · spelling":" · meaning"),score:a.score+"/"+a.max,band:null,extra:Math.round(100*a.score/a.max)+"%"}}),"Every quiz you finish appears here, newest first, with Review and Delete.")+'</section></div>'+'</details>'+
    '<section class="panel"><h2>Where these words come from</h2><ul class="srcs">'+
      '<li><b>Academic Word List</b>: Averil Coxhead (2000), Victoria University of Wellington. 570 word families that are frequent across academic texts, in 10 sublists; sublist 1 is the most frequent. Headwords are from the published list; definitions are written for this page.</li>'+
      '<li><b>Topic vocabulary</b>: the subjects that recur in IELTS Reading passages, Writing Task 2 questions and Speaking Part 3, such as environment, education, health, technology, work, cities, crime, media, globalisation, science, society and culture.</li>'+
      '<li><b>Writing and Speaking language</b>: reporting trends and comparisons for Task 1 (including your own word bank), cohesive devices for Task 2, and phrases for giving and hedging opinions.</li></ul>'+
      '<div class="lexd"><b>What examiners reward (Lexical Resource, public band descriptors)</b>Band 7 uses less common words with some awareness of style and collocation; Band 8 uses a wide range fluently and flexibly, with only occasional errors in word choice. Memorised phrases that do not fit the question earn little, so learn each word with how it is used.</div></section></main>';
  $("#app").innerHTML=h;
  $("#toSim").onclick=function(){location.href='index.html'};
  vBind();
  $$("[data-go]").forEach(function(b){b.onclick=function(){var s=SETS.filter(function(x){return x.id===b.dataset.s})[0];({learn:learn,quiz:quiz,spell:spell})[b.dataset.go](s)}});
  $$("[data-svgo]").forEach(function(b){b.onclick=function(){var g=b.dataset.svgo;if(g==="list")return savedList();({learn:learn,quiz:quiz,spell:spell})[g](savedSet())}});
  bindHist($("#histp"),function(id){var a=HIST.filter(function(x){return x.id===id})[0];if(a)showResult(a)},
    function(id){if(id){HIST=HIST.filter(function(x){return x.id!==id});markDeleted("vc",id);saveLocal();if(DBC)DBC.doc(id).delete().catch(function(){});toast("Quiz deleted")}home()});
  window.scrollTo(0,0);
}
function shell(s,mode,body){
  return '<header class="top"><div class="wrap"><div class="brand"><button class="cbtn" id="back">← All sets</button><span class="tag">'+esc(mode)+'</span><b>'+esc(s.name)+'</b></div>'+
    '<span class="clock tab">'+mastered(s)+' / '+s.words.length+' mastered</span></div></header><main class="wrap">'+body+'</main>';
}
function wire(){var b=$("#back");if(b)b.onclick=home}

/* ---------- flashcards ---------- */
var SAMPLER=null;
function sampler(){if(SAMPLER)return Promise.resolve(SAMPLER);if(!(CL()&&CL().use))return Promise.resolve(null);return CL().use("sample").then(function(s){SAMPLER=s;return s},function(){return null})}
function learn(s){
  VIEW="learn";
  if(!s.words.length){home();return}
  var order=shuffle(s.words).sort(function(a,b){return (KNOWN[wk(s,a)]===2)-(KNOWN[wk(s,b)]===2)}),i=0,shown=false;
  function draw(){
    var w=order[i],k=wk(s,w);
    $("#app").innerHTML=shell(s,"Flashcards",'<div class="prog2"><span>'+(i+1)+' / '+order.length+'</span><span class="mbar"><i style="width:'+(100*(i+1)/order.length)+'%"></i></span></div>'+
      '<div class="flash"><div class="svrow">'+starBtn(k)+'</div><p class="w">'+esc(w[0])+'</p><p class="pos">'+esc(w[1])+(KNOWN[k]===2?' · mastered':KNOWN[k]===1?' · still learning':'')+'</p>'+
      (shown?'<p class="def">'+esc(w[2])+'</p><div id="ex"></div>':'<p class="def muted">Say what it means, then reveal.</p>')+
      '<div class="ctl">'+(shown?'<button class="b" id="no">Still learning</button><button class="g" id="yes">Knew it</button><button id="exb">Examples by Claude</button>':'<button class="p" id="show">Reveal meaning</button>')+
      '<button id="skip">Skip</button></div></div>');
    wire();
    if(!shown)$("#show").onclick=function(){shown=true;draw()};
    else{
      $("#yes").onclick=function(){KNOWN[k]=2;saveKnown();next()};
      $("#no").onclick=function(){KNOWN[k]=1;saveKnown();next()};
      $("#exb").onclick=function(){examples(w)};
    }
    $("#skip").onclick=next;
    document.onkeydown=function(e){if(VIEW!=="learn")return;if(e.key===" "&&!shown){e.preventDefault();shown=true;draw()}else if(e.key==="ArrowRight")next()};
  }
  function next(){shown=false;i++;if(i>=order.length){toast("Set finished: "+mastered(s)+" of "+s.words.length+" mastered");home();return}draw()}
  draw();
}
function examples(w){
  var el=$("#ex");el.innerHTML='<p class="muted">Asking Claude for examples…</p>';
  sampler().then(function(sp){
    if(!sp){el.innerHTML='<p class="muted">Examples need Claude, which isn\'t available in this view.</p>';return}
    return sp.json('Give three natural example sentences for the English word or phrase "'+w[0]+'" ('+w[1]+', meaning: '+w[2]+'), at the level of an IELTS Band 7-8 candidate, on typical IELTS topics. Then give the two most useful collocations and the word family (other forms). Reply with JSON only: {"examples":["..","..",".."],"collocations":["..",".."],"family":"comma-separated forms"}',{modelTier:"quick"}).then(function(r){
      el.innerHTML='<ul class="ex">'+(r.examples||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul><p class="muted" style="margin:8px 0 0">Collocations: '+esc((r.collocations||[]).join(" · "))+'<br>Word family: '+esc(r.family||"")+'</p>'});
  }).catch(function(){el.innerHTML='<p class="muted">Claude could not answer just now. Try again in a moment.</p>'});
}

/* ---------- meaning quiz ---------- */
function quiz(s){
  VIEW="quiz";document.onkeydown=null;if(!s.words.length){home();return}
  var pool=shuffle(s.words).slice(0,10),i=0,res=[];
  function draw(){
    var w=pool[i],dir=i%2?"def2word":"word2def";
    var others=shuffle(s.words.filter(function(x){return x[0]!==w[0]})).slice(0,3);
    while(others.length<3){var rs=SETS[Math.floor(Math.random()*SETS.length)],rw=rs.words[Math.floor(Math.random()*rs.words.length)];if(rw&&rw[0]!==w[0]&&!others.some(function(o){return o[0]===rw[0]}))others.push(rw)}
    var opts=shuffle(others.concat([w]));
    $("#app").innerHTML=shell(s,"Meaning quiz",'<div class="q"><p class="qh">Question '+(i+1)+' of '+pool.length+'</p>'+
      (dir==="word2def"?'<p class="prompt">What does <b>'+esc(w[0])+'</b> mean?</p>':'<p class="prompt">Which word means: <b style="font-size:1.25rem">'+esc(w[2])+'</b>?</p>')+
      '<div class="opts">'+opts.map(function(o,j){return '<button data-j="'+j+'">'+esc(dir==="word2def"?o[2]:o[0])+'</button>'}).join("")+'</div><div class="fb" id="fb"></div></div>');
    wire();
    $$(".opts button").forEach(function(b){b.onclick=function(){if($(".opts .ok"))return;var pick=opts[+b.dataset.j],ok=pick[0]===w[0];
      $$(".opts button").forEach(function(x){if(opts[+x.dataset.j][0]===w[0])x.classList.add("ok")});if(!ok)b.classList.add("no");
      res.push({w:w[0],def:w[2],ok:ok,given:pick[0],k:wk(s,w)});var k=wk(s,w);if(ok&&KNOWN[k]!==2)KNOWN[k]=2;if(!ok)KNOWN[k]=1;saveKnown();
      $("#fb").innerHTML=(ok?'<span class="right">Correct.</span> ':'<span class="wrong">Not quite.</span> ')+'<b>'+esc(w[0])+'</b>: '+esc(w[2])+' '+starBtn(k)+' <button class="gbtn" id="nx" style="margin-left:8px">'+(i+1<pool.length?"Next":"See score")+'</button>';
      $("#nx").onclick=function(){i++;if(i<pool.length)draw();else finish(s,"quiz",res)};$("#nx").focus()}});
  }
  draw();
}
/* ---------- spelling ---------- */
function spell(s){
  VIEW="spell";document.onkeydown=null;if(!s.words.length){home();return}
  var pool=shuffle(s.words).slice(0,10),i=0,res=[];
  function draw(){
    var w=pool[i];
    $("#app").innerHTML=shell(s,"Spelling",'<div class="q spell"><p class="qh">Word '+(i+1)+' of '+pool.length+' · type the word</p>'+
      '<p class="prompt">'+esc(w[2])+' <span class="muted">('+esc(w[1])+', '+w[0].length+' letters, starts with “'+esc(w[0][0])+'”)</span></p>'+
      '<input id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the word"><div class="fb" id="fb"></div></div>');
    wire();var inp=$("#sp");inp.focus();
    inp.onkeydown=function(e){if(e.key!=="Enter")return;e.preventDefault();
      if($("#nx")){$("#nx").click();return}
      var g=inp.value.trim().toLowerCase().replace(/\s+/g," "),ok=g===w[0].toLowerCase();inp.classList.add(ok?"ok":"no");inp.readOnly=true;
      res.push({w:w[0],def:w[2],ok:ok,given:inp.value.trim(),k:wk(s,w)});var k=wk(s,w);if(ok&&KNOWN[k]!==2)KNOWN[k]=2;if(!ok)KNOWN[k]=1;saveKnown();
      $("#fb").innerHTML=(ok?'<span class="right">Correct.</span>':'<span class="wrong">Correct spelling: '+esc(w[0])+'</span>')+' '+starBtn(k)+' <button class="gbtn" id="nx" style="margin-left:8px">'+(i+1<pool.length?"Next":"See score")+'</button> <span class="muted">or press Enter</span>';
      $("#nx").onclick=function(){i++;if(i<pool.length)draw();else finish(s,"spell",res)}};
  }
  draw();
}
function finish(s,mode,res){
  var a={id:"v"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),set:s.id,mode:mode,num:SETS.indexOf(s)+1,at:new Date().toISOString(),
    score:res.filter(function(r){return r.ok}).length,max:res.length,res:res};
  addAttempt(a);showResult(a);
}
function showResult(a){
  var s=setById(a.set);VIEW="result";document.onkeydown=null;
  $("#app").innerHTML=shell(s,a.mode==="spell"?"Spelling":"Meaning quiz",'<section class="panel" style="margin-top:18px"><div class="score"><span class="big">'+a.score+'</span><span class="of">/ '+a.max+'</span><span class="muted">'+esc(new Date(a.at).toLocaleString())+'</span></div>'+
    '<ul class="reslist">'+a.res.map(function(r){var k=r.k||a.set+"|"+r.w;return '<li><span class="'+(r.ok?"y":"n")+'">'+(r.ok?"✓":"✗")+'</span><span><b>'+esc(r.w)+'</b>'+(r.ok?'':' <span class="muted">· you chose “'+esc(r.given||"—")+'”</span>')+'<small>'+esc(r.def)+'</small></span>'+(WBYK[k]?starBtn(k):'')+'</li>'}).join("")+'</ul>'+
    (a.res.some(function(r){return !r.ok})?'<div class="actions" style="margin-top:12px"><button class="gbtn" id="svall">☆ Save all I got wrong</button></div>':'')+'</section>'+
    '<div class="actions"><button class="pbtn" id="again">Same set again</button><button class="gbtn" id="fc">Flashcards for this set</button><button class="gbtn" id="hm">All sets</button></div>');
  wire();var sa=$("#svall");if(sa)sa.onclick=function(){a.res.forEach(function(r){var k=r.k||a.set+"|"+r.w;if(!r.ok&&WBYK[k]&&!isSaved(k))SAVED[k]=Date.now()});saveSaved();
    $$("[data-sv]").forEach(function(x){if(isSaved(x.dataset.sv)){x.classList.add("on");x.textContent="★ Saved"}});sa.textContent="★ Saved";sa.disabled=true;toast("Saved for recap")};
  $("#again").onclick=function(){(a.mode==="spell"?spell:quiz)(s)};$("#fc").onclick=function(){learn(s)};$("#hm").onclick=home;
}
try{var th=parent.document.documentElement.getAttribute("data-theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
home();
</script>
