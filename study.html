<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS Study">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>IELTS Writing</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --ground:#F6F7F9; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#E4EAF0;
  --ink:#16202B; --ink-2:#4E5D6C; --ink-3:#7B8896;
  --rule:#D7DEE6; --rule-strong:#B4C0CC;
  --accent:#1C4E6B; --accent-2:#2E7BA6; --accent-soft:#E2EDF4;
  --correct:#8E3B2B; --correct-soft:#F7E9E5;
  --gold:#8A6414; --gold-soft:#F7EFDB;
  --good:#2C6349; --good-soft:#E2F0E9;
  --chrome:#1B2733; --chrome-2:#243442; --chrome-ink:#E8EEF4; --chrome-ink-2:#9FB0C0;
  --shadow:0 1px 2px rgba(22,32,43,.06), 0 8px 24px -16px rgba(22,32,43,.24);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0B1016; --surface:#141C24; --surface-2:#1A242D; --surface-3:#222D37;
  --ink:#E4ECF3; --ink-2:#A6B4C0; --ink-3:#7C8B98;
  --rule:#2A3742; --rule-strong:#3B4B58;
  --accent:#82BEDD; --accent-2:#A3D2E9; --accent-soft:#16303F;
  --correct:#E5A395; --correct-soft:#33201C;
  --gold:#D9B667; --gold-soft:#2E2612;
  --good:#84C6A2; --good-soft:#15291F;
  --chrome:#0E161E; --chrome-2:#18242F; --chrome-ink:#E8EEF4; --chrome-ink-2:#8D9EAE;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0B1016; --surface:#141C24; --surface-2:#1A242D; --surface-3:#222D37;
  --ink:#E4ECF3; --ink-2:#A6B4C0; --ink-3:#7C8B98;
  --rule:#2A3742; --rule-strong:#3B4B58;
  --accent:#82BEDD; --accent-2:#A3D2E9; --accent-soft:#16303F;
  --correct:#E5A395; --correct-soft:#33201C;
  --gold:#D9B667; --gold-soft:#2E2612;
  --good:#84C6A2; --good-soft:#15291F;
  --chrome:#0E161E; --chrome-2:#18242F; --chrome-ink:#E8EEF4; --chrome-ink-2:#8D9EAE;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",Arial,sans-serif;font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",monospace}

#app{position:fixed;inset:10px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  border:1px solid var(--rule-strong);border-radius:7px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
@media (max-width:700px){#app{inset:4px;border-radius:5px}}

/* top chrome */
.topbar{display:flex;align-items:center;gap:14px;min-width:0;background:var(--chrome);color:var(--chrome-ink);
  padding:9px 14px;font-size:13px;border-bottom:1px solid #000}
.topbar .who{display:flex;align-items:center;gap:9px;min-width:0}
.topbar .av{width:22px;height:22px;border-radius:3px;background:var(--chrome-2);display:grid;place-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--chrome-ink-2);flex:none}
.topbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .nm b{font-weight:600}
.topbar .nm span{color:var(--chrome-ink-2);margin-left:7px;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.topbar .clock{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:"IBM Plex Mono",monospace;
  font-size:13.5px;font-weight:600;background:var(--chrome-2);padding:5px 12px;border-radius:4px;font-variant-numeric:tabular-nums}
.topbar .clock.warn{background:#5A2A1E;color:#FFD9CE}
.topbar .clock.crit{background:#7A2416;color:#FFE2DA;animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.55}}
.topbar .tools{display:flex;gap:6px}
.topbar button{font:inherit;font-size:12px;background:var(--chrome-2);color:var(--chrome-ink);border:1px solid #0006;
  border-radius:4px;padding:5px 11px;cursor:pointer}
.topbar button{white-space:nowrap}
.topbar button:hover{background:#2E4051}
.topbar button:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}

/* instruction strip */
.instr{background:var(--surface-2);border-bottom:1px solid var(--rule);padding:9px 16px}
.instr h2{margin:0 0 2px;font-size:14.5px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.instr p{margin:0;font-size:12.8px;color:var(--ink-2)}
.instr .rng{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}

/* content */
.stage{min-height:0;min-width:0;overflow:hidden;position:relative}
.pane{height:100%;overflow-y:auto;padding:18px 22px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 7px minmax(0,1fr);height:100%;min-height:0;min-width:0}
.split>.pane{min-width:0}
.split .divider{background:var(--surface-2);border-left:1px solid var(--rule);border-right:1px solid var(--rule);
  cursor:col-resize;position:relative}
.split .divider::after{content:"";position:absolute;top:50%;left:1px;width:3px;height:40px;margin-top:-20px;
  background:var(--rule-strong);border-radius:2px}
@media (max-width:860px){.split{grid-template-columns:1fr;grid-template-rows:1fr 7px 1fr}
  .split .divider{cursor:row-resize;border:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}}

/* bottom chrome */
.botbar{background:var(--surface-2);border-top:1px solid var(--rule);padding:7px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.palette{display:flex;gap:12px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.pgroup{display:flex;align-items:center;gap:4px;flex:none}
.pgroup .lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-right:3px;white-space:nowrap}
.pbtn{width:26px;height:26px;flex:none;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);
  border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;cursor:pointer;padding:0;position:relative}
.pbtn:hover{border-color:var(--accent-2)}
.pbtn:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.pbtn.done{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.pbtn.here{outline:2px solid var(--ink);outline-offset:1px}
.pbtn.flag::after{content:"";position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.pbtn.ok{background:var(--good);border-color:var(--good);color:#fff}
.pbtn.no{background:var(--correct);border-color:var(--correct);color:#fff}
.navbtns{display:flex;gap:6px;flex:none}
.navbtns button,.reviewbox{font:inherit;font-size:12.5px;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink);border-radius:4px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.navbtns button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.navbtns button:disabled{opacity:.4;cursor:default}
.navbtns button:focus-visible,.reviewbox:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.reviewbox{display:flex;align-items:center;gap:6px;flex:none}
.reviewbox input{accent-color:var(--gold);margin:0}

/* question content inside panes */
.pane h3{font-family:"Newsreader",Georgia,serif;font-size:1.3rem;margin:0 0 6px;font-weight:600}
.pane .sub{font-size:.84rem;color:var(--ink-3);margin:0 0 16px}
.passage{font-family:"Newsreader",Georgia,serif;font-size:1.05rem;line-height:1.68}
.passage p{margin:0 0 14px;max-width:62ch}
.passage .pl{font-family:"IBM Plex Mono",monospace;font-size:.76em;font-weight:600;color:var(--accent);margin-right:7px;vertical-align:2px}
.qblock{border-top:1px solid var(--rule);margin-top:20px;padding-top:16px}
.qblock:first-child{border-top:none;margin-top:0;padding-top:0}
.qrange{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 6px}
.rubric{font-size:.9rem;color:var(--ink-2);margin:0 0 14px}
.rubric strong{color:var(--ink)}
ol.qs{list-style:none;margin:0 0 16px;padding:0}
ol.qs>li{display:grid;grid-template-columns:30px 1fr;gap:9px;padding:7px 0;border-bottom:1px dotted var(--rule);align-items:start;scroll-margin-top:12px}
ol.qs>li:last-child{border-bottom:none}
ol.qs>li.cur{background:var(--accent-soft);border-radius:3px;padding-left:5px;margin-left:-5px}
ol.qs>li>.qn{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;color:var(--ink-3);padding-top:2px}
ol.qs .opts{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:.93rem}
ol.qs .opts li{display:grid;grid-template-columns:22px 1fr;gap:6px;cursor:pointer;border-radius:3px;padding:3px 6px;margin-left:-6px}
ol.qs .opts li:hover{background:var(--surface-2)}
ol.qs .opts li.sel{background:var(--accent-soft)}
ol.qs .opts li.sel .ol{color:var(--accent);font-weight:700}
ol.qs .opts li.okright{background:var(--good-soft)} ol.qs .opts li.okright .ol{color:var(--good)}
ol.qs .opts li.okwrong{background:var(--correct-soft)} ol.qs .opts li.okwrong .ol{color:var(--correct)}
ol.qs .opts .ol{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink-3)}
.optionbox{border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface-2);padding:12px 14px;margin:0 0 16px;max-width:52ch}
.optionbox .obt{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 8px;display:block}
.optionbox ul,.optionbox ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.optionbox li{display:grid;grid-template-columns:30px 1fr;gap:7px}
.optionbox .ol{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent)}
.formtbl,.notebox{border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface);padding:16px 18px;margin:0 0 18px;max-width:58ch}
.formtbl h5,.notebox h5{margin:0 0 4px;font-family:"Newsreader",Georgia,serif;font-size:1.12rem;font-weight:600}
.formtbl h5{text-align:center}
.formtbl .sub{text-align:center;font-size:.76rem;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.formtbl dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.93rem}
.formtbl dt{font-weight:500;color:var(--ink-2)} .formtbl dd{margin:0}
.notebox h6{margin:14px 0 5px;font-size:.8rem;font-weight:600;font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.notebox ul{margin:0;padding-left:18px;font-size:.93rem} .notebox li{margin-bottom:5px}
.qnum{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--accent);font-size:.84rem;margin-right:4px}
figure{margin:0 0 16px} figure svg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--rule);border-radius:3px}
figcaption{font-size:.78rem;color:var(--ink-3);margin-top:6px;font-family:"IBM Plex Mono",monospace}
.box{border:1px solid var(--rule);border-radius:3px;background:var(--surface);padding:13px 15px;margin:0 0 16px;max-width:60ch}
.tw{overflow-x:auto;margin:0 0 16px;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:380px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{background:var(--surface-2);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap} td.mono{font-family:"IBM Plex Mono",monospace}
tbody tr:last-child td{border-bottom:none}
.prompt{font-weight:600}
input.gapin{font-family:"IBM Plex Mono",monospace;font-size:.9em;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-strong);border-radius:3px;padding:3px 7px;margin:0 3px;min-width:140px;width:140px}
input.gapin.sz-letter{min-width:50px;width:50px;text-align:center;text-transform:uppercase}
input.gapin.sz-tfng{min-width:108px;width:108px;text-transform:uppercase}
input.gapin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.gapin.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
input.gapin.wrong{border-color:var(--correct);background:var(--correct-soft);color:var(--correct);font-weight:600}
.corr{font-family:"IBM Plex Mono",monospace;font-size:.78em;color:var(--good);font-weight:600;margin-left:6px;white-space:nowrap}
mark.hl{background:var(--gold-soft);border-bottom:1.5px solid var(--gold);padding:0 1px}
textarea.wbox{display:block;width:100%;height:100%;min-height:260px;font-family:"Newsreader",Georgia,serif;font-size:1.02rem;
  line-height:1.6;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;padding:13px 15px;resize:none}
textarea.wbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wcount{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:right;margin-top:5px}
.wcount.under{color:var(--correct);font-weight:600} .wcount.over{color:var(--good);font-weight:600}

/* overlays */
.sheet{position:absolute;inset:0;background:var(--surface);overflow-y:auto;padding:28px 30px;z-index:20}
.sheet h1{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:2.1rem;margin:0 0 6px;letter-spacing:-.02em}
.sheet h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.25rem;margin:26px 0 10px}
.sheet p{max-width:66ch;color:var(--ink-2)}
.sheet .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:16px 0;max-width:900px}
.card{border:1px solid var(--rule-strong);border-radius:5px;background:var(--surface);padding:15px 16px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card:hover{border-color:var(--accent);background:var(--accent-soft)}
.card:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.card b{display:block;font-size:1.02rem;margin-bottom:3px}
.card span{font-size:.85rem;color:var(--ink-2)}
.card .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-top:8px}
.scorehead{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;border:1px solid var(--rule-strong);border-radius:5px;
  background:var(--surface-2);padding:18px 22px;margin:14px 0 22px;max-width:620px}
.scorehead .big{font-family:"IBM Plex Mono",monospace;font-size:2.6rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.scorehead .lab{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.scorehead .band{color:var(--accent)}
.rowlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:5px;max-width:900px;margin:0 0 20px}
.rowlist .r{display:flex;gap:8px;align-items:baseline;font-size:.86rem;border:1px solid var(--rule);border-radius:3px;padding:5px 9px;background:var(--surface)}
.rowlist .r.ok{border-color:var(--good);background:var(--good-soft)}
.rowlist .r.no{border-color:var(--correct);background:var(--correct-soft)}
.rowlist .r b{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);flex:none;width:20px}
.rowlist .r .you{font-family:"IBM Plex Mono",monospace;text-decoration:line-through;color:var(--correct)}
.rowlist .r .ans{font-family:"IBM Plex Mono",monospace;color:var(--good);font-weight:600}
.misslist{display:flex;flex-direction:column;gap:6px;max-width:860px;margin:0 0 20px}
.misslist .m{display:grid;grid-template-columns:26px 1fr;gap:9px;border:1px solid var(--rule);
  border-left:3px solid var(--correct);border-radius:0 3px 3px 0;background:var(--surface);padding:8px 12px}
.misslist .m>b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);padding-top:2px}
.misslist .m .ans{font-family:"IBM Plex Mono",monospace;color:var(--good);font-weight:600;font-size:.9rem}
.misslist .m p{margin:3px 0 0;font-size:.86rem;color:var(--ink-2);max-width:70ch}
details.key{border:1px solid var(--accent);border-radius:3px;background:var(--accent-soft);margin:0 0 12px;max-width:72ch}
details.key>summary{cursor:pointer;padding:11px 15px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);list-style:none}
details.key>summary::-webkit-details-marker{display:none}
details.key>summary::before{content:"\25B8  "}
details.key[open]>summary::before{content:"\25BE  "}
details.key .kbody{padding:4px 16px 16px;background:var(--surface);border-top:1px solid var(--accent)}
details.key .model{font-family:"Newsreader",Georgia,serif;font-size:1.04rem;line-height:1.66}
details.key .model p{margin:0 0 12px;max-width:68ch}
details.key .wc{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);text-align:right;
  border-top:1px solid var(--rule);padding-top:8px;margin:12px 0 0}
details.key .gloss{font-size:.85rem;color:var(--ink-2);border-top:1px dashed var(--rule);margin-top:12px;padding-top:11px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.btnrow button{font:inherit;font-size:.88rem;font-weight:600;border-radius:4px;padding:9px 17px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btnrow button.ghost{background:transparent;color:var(--accent)}
.btnrow button:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.notice{border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 3px 3px 0;padding:12px 15px;margin:0 0 18px;max-width:66ch;font-size:.88rem}
.notice b{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:5px}
.hlbar{position:absolute;z-index:30;display:none;gap:2px;background:var(--chrome);border-radius:4px;padding:3px;box-shadow:var(--shadow)}
.hlbar button{font:inherit;font-size:11.5px;background:transparent;color:var(--chrome-ink);border:none;border-radius:3px;padding:5px 10px;cursor:pointer}
.hlbar button:hover{background:var(--chrome-2)}
.spk{max-width:70ch}
.qbh{font-family:"Newsreader",Georgia,serif;font-size:1.12rem;font-weight:600;margin:22px 0 8px}
.qrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr) minmax(0,1.5fr);gap:16px;border:1px solid var(--rule);border-left:3px solid var(--good);border-radius:0 4px 4px 0;padding:10px 13px;margin:0 0 8px;max-width:1150px;background:var(--surface)}
.qrow.no{border-left-color:var(--correct);background:linear-gradient(90deg,var(--correct-soft),var(--surface) 30%)}
.qrow .qq{font-size:.9rem;line-height:1.5}
.qrow .qq b{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-3);margin-right:4px}
.qrow .qq .opt{display:block;font-size:.84rem;color:var(--ink-2);margin-top:2px}
.qrow .qq .opt.c{color:var(--good);font-weight:600}
.qrow .lab{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 2px}
.qrow .qa .ans{display:block;font-family:"IBM Plex Mono",monospace;color:var(--good);font-weight:600;margin-bottom:6px}
.qrow .qa .you2{display:block;font-family:"IBM Plex Mono",monospace;color:var(--correct);font-weight:600;text-decoration:line-through;margin-bottom:6px}
.qrow .qe .excerpt{margin:0}
